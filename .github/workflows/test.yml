name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate plugin manifests
        run: node -e "for (const file of ['.codex-plugin/plugin.json', '.agents/plugins/marketplace.json']) JSON.parse(require('fs').readFileSync(file, 'utf8'));"

      - name: Run tests
        run: npm test
